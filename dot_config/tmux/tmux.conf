# ==============================================================================
# 1. CORE & TERMINAL SETTINGS
# ==============================================================================
# Executa shell-ul implicit ca shell non-login (pastreaza env intact)
set -g default-command "${SHELL}"

# True color & terminal features
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -as terminal-features ',xterm-256color:RGB'

# Esential pentru Neovim: elimina delay-ul la apasarea tastei ESC
set -s escape-time 0

# Clipboard passthrough & OSC 52 integration
set -s set-clipboard on
set -g allow-passthrough on
set -g mouse on

# Focus events pentru autoread si pluginuri in Neovim
set -g focus-events on

# ==============================================================================
# 2. INDEXING & WINDOW MANAGEMENT
# ==============================================================================
# Indexare de la 1 pentru ferestre si pane-uri (ergonomie pe tastatura)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pastreaza directorul curent la deschiderea de pane-uri si ferestre noi
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# 3. NAVIGATION & KEYBINDINGS
# ==============================================================================
# Selectie pane-uri in stil Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Switch pane-uri cu Alt + Sageti (fara prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch ferestre cu Shift + Sageti
bind -n S-Left previous-window
bind -n S-Right next-window

# Switch ferestre cu Shift + Alt + H/L (Vim-style)
bind -n M-H previous-window
bind -n M-L next-window

# Reincarcare rapida a configuratiei
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# ==============================================================================
# 4. VI COPY MODE & CLIPBOARD
# ==============================================================================
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# 5. THEME CONFIGURATION (Catppuccin Mocha)
# ==============================================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

set -g status-left ""
set -gF status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"

# ==============================================================================
# 6. PLUGINS & PLUGIN OPTIONS
# ==============================================================================
set -g @resurrect-strategy-nvim 'session'
set -g @yank_selection_command 'wl-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ==============================================================================
# 7. INITIALIZE TPM (Trebuie sa ramana mereu ultima linie)
# ==============================================================================
run '~/.tmux/plugins/tpm/tpm'
